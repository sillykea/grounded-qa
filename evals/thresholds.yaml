# The build fails if a metric falls past its threshold. Each is set a little
# below the measured baseline, so noise doesn't fail builds but a real
# regression does.
retrieval:
  recall_at_4: 0.95   # baseline 1.00 (BM25 and hybrid)
  recall_at_1: 0.80   # baseline 0.89 (BM25)
  mrr: 0.85           # baseline 0.94 (BM25)
answers:
  answer_pass_rate: 0.0   # set from the first CI run with the real model
