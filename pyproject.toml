[project]
name = "grounded-qa"
version = "0.1.0"
description = "Question answering over engineering docs with citations, and evals that fail CI when answers get worse"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
grounded-qa = "grounded_qa.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grounded_qa"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # a split string is the readable way to write a stop-word list

[tool.pytest.ini_options]
testpaths = ["tests"]
